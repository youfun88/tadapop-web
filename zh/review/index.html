<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>新版中文旁白（審閱中）— Tadapop</title>
  <!-- A private review page: not linked, not in the sitemap, not indexed.
       It plays film3.js, the new Chinese narration, beside the live one. -->
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#0B0E17" />
  <link rel="icon" href="/assets/favicon.png" />
  <link rel="stylesheet" href="/styles.css" />
<link rel="stylesheet" href="/film.css" />
<style>
  .cut { max-width: 44rem; margin: 0 auto; padding: 3rem 1.25rem 5rem; }
  .cut h1 { font-size: 1.6rem; margin: 0 0 .4rem; }
  .cut .sub { opacity: .7; line-height: 1.6; margin: 0 0 2rem; }
  .cut .card { border: 1px solid rgba(255,255,255,.14); border-radius: 16px; padding: 1.5rem; margin: 0 0 1.25rem;
               background: rgba(255,255,255,.03); }
  .cut .k { font-family: ui-monospace, "JetBrains Mono", monospace; font-size: .72rem; letter-spacing: .12em;
            text-transform: uppercase; opacity: .55; margin: 0 0 .6rem; }
  .cut h2 { font-size: 1.15rem; margin: 0 0 .5rem; }
  .cut p { line-height: 1.65; opacity: .85; margin: 0 0 1rem; }
  .cut .go { display: inline-block; background: #FFB454; color: #0B0E17; font-weight: 700;
             padding: .8rem 1.5rem; border-radius: 999px; text-decoration: none; border: 0; font: inherit;
             font-weight: 700; cursor: pointer; }
  .cut .other { display: flex; gap: .75rem; flex-wrap: wrap; margin-top: 1rem; }
  .cut .other a { color: inherit; opacity: .75; border: 1px solid rgba(255,255,255,.16);
                  border-radius: 999px; padding: .5rem 1rem; text-decoration: none; font-size: .9rem; }
</style>
</head>
<body>
  <main class="cut">
    <h1>新版中文旁白 · 審閱用</h1>
    <p class="sub">依 2026-09-15 的兩份旁白稿重新錄製的版本。畫面和首頁一樣，只有旁白和字幕換新。首頁目前仍播舊版，確認後才會換上去。</p>

    <div class="card">
      <p class="k">團體</p>
      <h2>打卡俱樂部</h2>
      <p>依「影片旁白 - 中文 - 團體」。按下播放就有聲音。</p>
      <button class="go" type="button" data-film-cut="arena" aria-haspopup="dialog">
        ▶ 播放打卡俱樂部 <span class="film-launch-time"></span>
      </button>
    </div>

    <div class="card">
      <p class="k">個人</p>
      <h2>每日任務</h2>
      <p>依「影片旁白 - 中文 - 個人」。</p>
      <button class="go" type="button" data-film-cut="solo" aria-haspopup="dialog">
        ▶ 播放每日任務 <span class="film-launch-time"></span>
      </button>
      <div class="other">
        <a href="/zh/">對照：首頁目前的版本</a>
      </div>
    </div>
  </main>

  <div class="film-overlay" id="filmOverlay" role="dialog" aria-modal="true" aria-label="Tadapop 介紹影片（新版旁白）" hidden></div>
<!-- ?cut=solo makes 每日任務 the default, so ?cut=solo&film=1 autoplays it. -->
<script>window.TADAPOP_FILM_CUT = /[?&]cut=solo\b/.test(location.search) ? 'solo' : 'arena';</script>
<script src="/film3.js" defer></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Habit intro stage — Tadapop</title>
<!--
  The source of the habit-programs intro film that the app plays before its
  first question. Not a page anyone lands on: tools/habits/render.mjs opens it
  at 360x640 CSS px, seeks it frame by frame through window.__habits.seek(t)
  and stitches the frames and the voice into assets/habits/*.mp4. Open it in a
  browser to preview it (silent); ?lang=zh for Chinese.

  Every scene is a pure function of time, like the promo's, so any frame can be
  captured at any speed and look the same.
-->
<link rel="stylesheet" href="/styles.css" />
<style>
  html, body { margin: 0; background: #05070c; }
  body { display: grid; place-items: center; min-height: 100vh; }
  #stage {
    position: relative; width: 360px; height: 640px; overflow: hidden;
    background: radial-gradient(120% 80% at 50% 34%, #141b2e 0%, #0B0E17 62%, #070910 100%);
    color: #E8ECF5; font-family: 'Inter', 'PingFang TC', system-ui, sans-serif;
  }
  #stage * { box-sizing: border-box; }
  .grid {
    position: absolute; inset: 0; opacity: .45; pointer-events: none;
    background-image: linear-gradient(#1c2540 1px, transparent 1px), linear-gradient(90deg, #1c2540 1px, transparent 1px);
    background-size: 36px 36px;
    -webkit-mask-image: radial-gradient(90% 60% at 50% 38%, #000 20%, transparent 80%);
            mask-image: radial-gradient(90% 60% at 50% 38%, #000 20%, transparent 80%);
  }
  .scene { position: absolute; inset: 0; }
  .disp { font-family: 'Chivo', 'PingFang TC', system-ui, sans-serif; }
  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
  .panel { background: #141A29; border: 1px solid #26304a; border-radius: 18px; }
  .kicker {
    position: absolute; left: 0; right: 0; top: 64px; text-align: center;
    font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: .22em; color: #FFB454;
  }
  :lang(zh) .kicker { letter-spacing: .12em; font-size: 12px; }
  .title {
    position: absolute; left: 24px; right: 24px; top: 88px; text-align: center;
    font-family: 'Chivo', 'PingFang TC', system-ui, sans-serif; font-weight: 900; font-size: 30px; line-height: 1.16;
  }
  :lang(zh) .title { font-weight: 800; font-size: 29px; line-height: 1.3; letter-spacing: 1px; }
  .title b { color: #FFB454; font-weight: inherit; }
  /* The captions: what is being said, under the picture. The app plays this
     full screen, so nothing covers the bottom the way social apps do. */
  #cc {
    position: absolute; left: 20px; right: 20px; top: 500px; min-height: 92px;
    display: flex; align-items: center; justify-content: center; text-align: center;
    font-size: 17px; line-height: 1.38; font-weight: 500; color: #E8ECF5;
    text-shadow: 0 1px 12px rgba(0,0,0,.6);
  }
  :lang(zh) #cc { font-size: 18px; line-height: 1.5; letter-spacing: .5px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 999px;
    border: 1px solid #26304a; background: #1A2233; font-size: 14px; font-weight: 600;
  }
  .tile {
    width: 66px; height: 66px; border-radius: 14px; border: 1px solid #26304a; background: #141A29;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 10px; color: #7C8AA5;
  }
  .tile span:first-child { font-size: 24px; }
  .conf { position: absolute; width: 7px; height: 7px; }
</style>
</head>
<body>
  <div id="stage"><div class="grid"></div><div id="root"></div><div id="cc"></div></div>
  <script src="habits.js"></script>
</body>
</html>

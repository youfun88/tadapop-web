<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Join a challenge · Tadapop</title>
<meta name="description" content="You've been invited to a Tadapop Arena challenge." />
<meta name="robots" content="noindex" />
<link rel="alternate" hreflang="en" href="https://www.tadapop.app/join" />
<link rel="alternate" hreflang="zh-Hant" href="https://www.tadapop.app/zh/join" />
<link rel="alternate" hreflang="x-default" href="https://www.tadapop.app/join" />
<link rel="stylesheet" href="/styles.css" />
<style>
  /* This page is reached in one of two ways:
     - iOS with the app installed: it never renders — the universal link opens
       the app directly (see /.well-known/apple-app-site-association).
     - Everyone else: this is the landing page, so it has to carry the code
       somewhere a person can read and retype it. */
  .invite { max-width: 34rem; margin: 0 auto; padding: 4rem 1.5rem; text-align: center; }
  .invite h1 { font-size: 1.6rem; margin: 0 0 .75rem; }
  .invite p { opacity: .8; line-height: 1.6; margin: 0 0 1.5rem; }
  .code {
    /* The trailing letter-spacing counts toward the width, so at 2rem with
       .35em tracking the pill was 3px wider than a 360px phone and put the
       page into horizontal scroll. Fluid type, and a max-width so it can
       never do that again whatever the code length. */
    /* BLOCK, so the copy control below sits on its own line rather than
       alongside the pill. `fit-content` keeps the pill hugging the code, and
       max-width keeps the narrow-phone fix above intact. */
    display: block; width: fit-content; margin-left: auto; margin-right: auto;
    font-family: ui-monospace, "JetBrains Mono", monospace;
    max-width: 100%; box-sizing: border-box;
    font-size: clamp(1.4rem, 7.5vw, 2rem); letter-spacing: .3em; font-weight: 700;
    padding: .75rem 1.25rem .75rem 1.6rem; border-radius: 12px;
    border: 1px solid rgba(255,255,255,.18); background: rgba(255,255,255,.04);
    margin-bottom: 1.75rem;
  }
  /* COPY, because the code has to survive a trip to the App Store.
     
     iOS has no deferred deep linking: somebody without the app taps the
     invite, lands here, leaves for the store, installs, opens — and the app
     has no idea any of that happened. Showing the code is not enough, because
     by the time they need it this page is three screens behind them. On the
     clipboard it is still there, and both platforms offer it as a paste
     suggestion the moment the code field is focused.
     
     A button rather than "tap the code": a copy that fires when somebody
     merely touches the thing they were told to read is a surprise, and on this
     page a surprise costs the invite. */
  .copy {
    display: inline-block; margin: -1rem 0 1.75rem;
    background: none; border: 0; padding: .4rem .6rem;
    font: inherit; font-size: .85rem; color: inherit; opacity: .65;
    text-decoration: underline; text-underline-offset: 3px; cursor: pointer;
  }
  .copy:hover, .copy:focus-visible { opacity: 1; }
  .copy.done { opacity: 1; color: #7FE0A8; text-decoration: none; }
  .actions { display: flex; flex-direction: column; gap: .75rem; align-items: center; }
  .actions a { display: inline-block; padding: .85rem 1.6rem; border-radius: 999px; text-decoration: none; font-weight: 600; }
  .primary { background: #FFB454; color: #1B2438; }
  .secondary { border: 1px solid rgba(255,255,255,.2); }
  .hint { font-size: .85rem; opacity: .6; margin-top: 1.5rem; line-height: 1.6; }
  /* Raised when the deep link did not take, which is the moment the typed-in
     code stops being a footnote and becomes the way in. */
  .hint.nudge {
    opacity: 1; border: 1px solid rgba(255, 180, 84, .45);
    background: rgba(255, 180, 84, .08); border-radius: 10px; padding: .9rem 1rem;
  }
  /* The switcher sits under the hint, well below the primary action — this
     page's job is to get someone into a challenge, not to offer them a menu. */
  .lang-foot { margin-top: 2rem; }
  .lang-foot .lang-switch::before { content: none; }
</style>
</head>
<body>
  <header class="lang-corner" data-lang-switch></header>
  <main class="invite">
    <h1>You've been invited to a challenge</h1>
    <p>Open Tadapop and enter this code to join.</p>

    <div class="code" id="code">——————</div>
    <button type="button" class="copy" id="copy" hidden>Copy code</button>

    <div class="actions">
      <a class="primary" id="open" href="#">Open in Tadapop</a>
      <a class="secondary" href="/#get">Get the app</a>
    </div>

    <p class="hint" id="hint">
      Already have Tadapop? Tapping this link on your phone should open it straight to the invite.
      If it doesn't, open the app, tap <strong>Arena → Join code</strong> and type the code above.
    </p>

  </main>

<script>
  var COPY_LABEL = "Copy code";
  var COPY_DONE = "Copied";
  var COPY_FAIL = "Copy it by hand";

  /* execCommand is deprecated and still the only thing that works in an in-app
     browser without a secure context — which is where a chat-app invite is
     most likely to be opened. */
  function legacyCopy(text) {
    try {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:absolute;left:-9999px;top:0';
      document.body.appendChild(ta);
      ta.select();
      var ok = document.execCommand('copy');
      document.body.removeChild(ta);
      return ok;
    } catch (e) {
      return false;
    }
  }

  // The code is whatever follows "join": /join/ABC123, /zh/join/ABC123.
  //
  // Taking the *last* segment instead is the trap: on a bare /join it hands
  // back "join", which looks exactly like a valid code and gets shown to the
  // visitor as one. Links lose their tail all the time when they are pasted
  // into a chat app, so this is the routine case, not the exotic one — and a
  // confidently wrong code is worse than no code, because the person retypes
  // it and blames themselves. Nothing after "join" means no code.
  var segs = location.pathname.split('/').filter(Boolean);
  var at = segs.indexOf('join');
  var raw = '';
  try { raw = at >= 0 && segs[at + 1] ? decodeURIComponent(segs[at + 1]) : ''; }
  catch (e) { /* a mangled %-escape is a broken link, not a code */ }
  var code = raw.toUpperCase().replace(/[^A-Z0-9]/g, '');
  var valid = /^[A-Z0-9]{4,10}$/.test(code);

  if (valid) {
    document.getElementById('code').textContent = code;
    document.title = 'Join with code ' + code + ' · Tadapop';
    /* The app's screen is arena/join and it reads the code off the query
       string (useLocalSearchParams<{ code }>), so that is the shape the link
       has to take. It used to be tadapop://join/<code>, which matches no route
       the app has — the scheme fired, iOS handed it over, and the app opened
       to nothing. A deep link is only as good as the route on the other end;
       if arena/join ever moves, this moves with it. */

    /* Put the code on the clipboard, so it is still in hand after the store.
       
       navigator.clipboard needs a secure context and is not on every browser
       that reaches this page, so there is a fallback — and if BOTH fail the
       button says so rather than lying, because a visitor who believes they
       copied it will paste whatever was on the clipboard before. */
    var copyBtn = document.getElementById('copy');
    if (copyBtn) {
      copyBtn.hidden = false;
      copyBtn.addEventListener('click', function () {
        function done(ok) {
          copyBtn.textContent = ok ? COPY_DONE : COPY_FAIL;
          copyBtn.classList.toggle('done', ok);
          setTimeout(function () {
            copyBtn.textContent = COPY_LABEL;
            copyBtn.classList.remove('done');
          }, 2400);
        }
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(code).then(function () { done(true); }, function () { done(legacyCopy(code)); });
        } else {
          done(legacyCopy(code));
        }
      });
    }

    var deepLink = 'tadapop://arena/join?code=' + encodeURIComponent(code);
    var openBtn = document.getElementById('open');
    openBtn.setAttribute('href', deepLink);

    /* Opening the app must never cost the page.
       ------------------------------------------------------------------
       This used to send the top-level location to tadapop:// — and it did it
       automatically, before the visitor had touched anything. In a normal
       browser that is harmless: the OS prompt appears and the page stays put.
       Inside an in-app browser it is not. LINE's webview follows the
       navigation, has nothing it can render, and leaves a blank black screen
       — taking the join code with it, which is the one thing the visitor
       still needed. An invite that ends in a blank screen is a dead invite.

       So the page never navigates itself away any more. In an in-app browser
       the scheme is offered through a hidden iframe, which the webview either
       hands to the OS or quietly ignores; either way this document survives.
       Everywhere else the direct navigation is kept, because that is what
       makes the prompt appear and the page is not at risk there.

       If nothing has taken over after a beat, the code is promoted from a
       footnote to the answer, rather than the visitor being left guessing. */
    var UA = navigator.userAgent || '';
    var IN_APP = /(\bLine\b|FBAN|FBAV|FB_IAB|Instagram|MicroMessenger|KAKAOTALK|Twitter)/i.test(UA);
    /* LINE is singled out because it is the one in-app browser with a way out:
       a link carrying openExternalBrowser=1 is handed to the system browser
       instead of being opened inside LINE. The others have no such switch. */
    var IS_LINE = /\bLine\b/i.test(UA);
    var EXTERNAL_URL = location.origin + location.pathname + '?openExternalBrowser=1';
    /* We arrived here because LINE was asked to hand us to Safari — so finish
       the job the visitor already started rather than making them tap again. */
    var HANDED_OVER = /[?&]openExternalBrowser=1/.test(location.search);
    var left = false;
    function markLeft() { left = true; }
    document.addEventListener('visibilitychange', function () { if (document.hidden) markLeft(); });
    window.addEventListener('pagehide', markLeft);

    openBtn.addEventListener('click', function (e) {
      e.preventDefault();
      left = false;
      /* Both ways of firing a custom scheme from inside LINE have now been
         tried on a real phone and neither opens the app. The iframe is refused
         outright — iOS has blocked that since iOS 9. Sending the top-level
         location there raises the permission prompt and then leaves a blank
         black screen, because the webview follows the navigation and cannot
         render a tadapop:// URL, taking the invite code with it.

         Which left the button doing nothing at all, which is its own bug: the
         one obvious control on the page, and tapping it produced silence.

         The way out of a webview is out of the webview. So in LINE this button
         does the only thing that can work — hands the page to the system
         browser, where the scheme behaves and the page survives whatever the
         visitor answers to the prompt. The trip is invisible: Safari opens on
         this same page and fires the deep link on arrival (see HANDED_OVER),
         so from the visitor's side one tap still lands in the app.

         Other in-app browsers have no equivalent switch, so they get the
         iframe — which costs nothing when it fails — and then the code, which
         is what they will actually be using. */
      if (IS_LINE) {
        window.location.href = EXTERNAL_URL;
        return;
      }
      if (IN_APP) {
        var f = document.createElement('iframe');
        f.setAttribute('aria-hidden', 'true');
        f.setAttribute('tabindex', '-1');
        f.style.cssText = 'position:absolute;width:0;height:0;border:0;opacity:0';
        f.src = deepLink;
        document.body.appendChild(f);
        setTimeout(function () { if (f.parentNode) f.parentNode.removeChild(f); }, 1200);
      } else {
        window.location.href = deepLink;
      }
      // Still here means the app never came forward.
      setTimeout(function () {
        if (left) return;
        var hint = document.getElementById('hint');
        if (hint) { hint.classList.add('nudge'); }
        if (hint) hint.scrollIntoView({ block: 'nearest' });
      }, 900);
    });

    /* Handed over from LINE: fire the deep link on arrival so the visitor does
       not have to tap the same button twice. Only ever runs in a real browser
       — IN_APP is checked because a webview without LINE's switch would still
       be sitting here with the parameter on the URL, and navigating there is
       what blanks the page. */
    if (HANDED_OVER && !IN_APP) {
      setTimeout(function () { openBtn.click(); }, 400);
    }
  } else {
    document.getElementById('code').textContent = '?';
    document.querySelector('.invite p').textContent =
      "That invite link doesn't look complete. Ask whoever invited you to send it again.";
    document.getElementById('open').style.display = 'none';
  }
</script>
<script src="/lang.js" defer></script>
</body>
</html>
